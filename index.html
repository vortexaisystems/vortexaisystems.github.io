<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex AI Systems</title>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #0b0e14; color: #fff; }
        /* Fondo con degradado sutil para el título */
        .hero { 
            padding: 100px 20px; 
            background: linear-gradient(180deg, #1a1d23 0%, #0b0e14 100%); 
            text-align: center; 
        }
        .title-3d { 
            font-size: 4rem; font-weight: 900; text-transform: uppercase; 
            color: #fff;
            text-shadow: 2px 2px 0px #444, 4px 4px 0px #222, 6px 6px 0px #000;
            margin-bottom: 20px;
        }
        .corporate-section { padding: 50px 20px; background-color: #11141b; text-align: center; }
        .image-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-top: 30px; }
        .image-card { width: 400px; border: 1px solid #333; padding: 15px; background: #1a1d23; border-radius: 8px; }
        .image-card img { width: 100%; border-radius: 4px; }
        
        /* Estilos de botones de servicios */
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 50px 20px; }
        .btn-service { background: #f39c12; color: #000; padding: 15px; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="hero">
        <h1 class="title-3d">VORTEX AI SYSTEMS</h1>
        <p>Automatización e IA para empresas de alto rendimiento.</p>
    </div>

    <!-- SECCIÓN DE SERVICIOS (Tus botones) -->
    <div class="services-grid">
        <button class="btn-service">BOT WHATSAPP 24/7</button>
        <button class="btn-service">CRM AUTOMATIZADO</button>
        <button class="btn-service">PIPELINE DE VENTAS</button>
    </div>

    <!-- SECCIÓN CORPORATIVA (Tus fotos) -->
    <section class="corporate-section">
        <h2>Estructura Corporativa</h2>
        <div class="image-grid">
            <div class="image-card">
                <img src="recepcion.jpg" alt="Recepción">
                <p><strong>Dirección:</strong> Eduardo Miguel Mera</p>
            </div>
            <div class="image-card">
                <img src="oficina.jpg" alt="Sala de Reuniones">
                <p><strong>Centro de Innovación Tecnológica</strong></p>
            </div>
        </div>
    </section>
</body>
</html>
